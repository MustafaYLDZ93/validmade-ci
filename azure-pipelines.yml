trigger:
  branches:
    include:
      - main

variables:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  SKIP_FAILED_TESTS: 'true'

pool:
  vmImage: 'ubuntu-latest'

steps:
  # --- Araclar ---
  - task: UseNode@1
    inputs:
      version: '$(NODE_VERSION)'
    displayName: 'Node.js $(NODE_VERSION) kur'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(PYTHON_VERSION)'
    displayName: 'Python $(PYTHON_VERSION) kur'

  # --- Jest ---
  - script: |
      cd jest-tests && npm ci
      if [ "$(SKIP_FAILED_TESTS)" = "true" ]; then
        npm test -- --testNamePattern="^(?!.*@failed-tests)"
      else
        npm test
      fi
    displayName: 'Jest testleri'
    env:
      JEST_JUNIT_OUTPUT_DIR: ./reports
      JEST_JUNIT_OUTPUT_NAME: junit.xml
      JEST_JUNIT_SUITE_NAME: '{filepath}'
      JEST_JUNIT_CLASSNAME: '{classname}'
      JEST_JUNIT_TITLE: '{title}'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'jest-tests/reports/junit.xml'
      testRunTitle: 'Jest'
    displayName: 'Jest sonuclarini yayinla'

  - publish: jest-tests/reports/junit.xml
    artifact: jest-junit
    condition: always()
    displayName: 'Jest artifact yukle'

  # --- Vitest ---
  - script: |
      cd vitest-tests && npm ci
      if [ "$(SKIP_FAILED_TESTS)" = "true" ]; then
        npx vitest run --reporter=junit --outputFile=reports/junit.xml -t "^((?!@failed-tests).)*$"
      else
        npm test
      fi
    displayName: 'Vitest testleri'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'vitest-tests/reports/junit.xml'
      testRunTitle: 'Vitest'
    displayName: 'Vitest sonuclarini yayinla'

  - publish: vitest-tests/reports/junit.xml
    artifact: vitest-junit
    condition: always()
    displayName: 'Vitest artifact yukle'

  # --- Mocha ---
  - script: |
      cd mocha-tests && npm ci
      if [ "$(SKIP_FAILED_TESTS)" = "true" ]; then
        npx mocha 'test/**/*.test.js' --reporter mocha-junit-reporter \
          --reporter-options mochaFile=reports/junit.xml \
          --fgrep "@failed-tests" --invert
      else
        npm test
      fi
    displayName: 'Mocha testleri'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'mocha-tests/reports/junit.xml'
      testRunTitle: 'Mocha'
    displayName: 'Mocha sonuclarini yayinla'

  - publish: mocha-tests/reports/junit.xml
    artifact: mocha-junit
    condition: always()
    displayName: 'Mocha artifact yukle'

  # --- Pytest ---
  - script: |
      cd pytest-tests && pip install -r requirements.txt
      if [ "$(SKIP_FAILED_TESTS)" = "true" ]; then
        pytest tests/ --junitxml=reports/junit.xml -v --tb=short -k "not failed_tests"
      else
        pytest tests/ --junitxml=reports/junit.xml -v --tb=short
      fi
    displayName: 'Pytest testleri'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'pytest-tests/reports/junit.xml'
      testRunTitle: 'Pytest'
    displayName: 'Pytest sonuclarini yayinla'

  - publish: pytest-tests/reports/junit.xml
    artifact: pytest-junit
    condition: always()
    displayName: 'Pytest artifact yukle'

  # --- Cypress ---
  - script: cd cypress-tests && npm ci && npm test
    displayName: 'Cypress testleri'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'cypress-tests/reports/junit.xml'
      testRunTitle: 'Cypress'
    displayName: 'Cypress sonuclarini yayinla'

  - publish: cypress-tests/reports/junit.xml
    artifact: cypress-junit
    condition: always()
    displayName: 'Cypress artifact yukle'

  # --- Raporlari Birlestir ---
  - script: python3 merge.py
    displayName: 'merge-reports: XML raporlari birlestir'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'junit-combined.xml'
      testRunTitle: 'Tum Testler'
    displayName: 'Birlesik raporu yayinla'

  - publish: junit-combined.xml
    artifact: junit-combined
    condition: always()
    displayName: 'Birlesik artifact yukle'
