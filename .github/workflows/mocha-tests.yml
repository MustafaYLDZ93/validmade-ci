name: Mocha Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'mocha-tests/**'
      - '.github/workflows/mocha-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mocha-tests/**'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js versiyonu'
        required: false
        default: '20'
        type: choice
        options:
          - '20'
          - '22'
          - '18'
      fail_fast:
        description: 'İlk hata görülünce dur'
        required: false
        default: false
        type: boolean

jobs:
  mocha:
    name: Mocha Tests (Node ${{ inputs.node_version || '20' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '20' }}
          cache: 'npm'
          cache-dependency-path: mocha-tests/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: mocha-tests
        run: npm ci

      - name: Mocha testlerini çalıştır (JUnit XML)
        working-directory: mocha-tests
        run: npm test

      - name: Test raporu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocha-junit-report
          path: mocha-tests/reports/junit.xml
          retention-days: 90
