name: Tüm Testler

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Hangi testleri çalıştır?'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - jest-only
          - pytest-only
          - vitest-only
          - mocha-only
          - cypress-only
          - playwright-only
          - hurl-only
          - k6-only
      node_version:
        description: 'Node.js versiyonu (Jest için)'
        required: false
        default: '20'
        type: choice
        options:
          - '20'
          - '22'
          - '18'
      python_version:
        description: 'Python versiyonu (pytest için)'
        required: false
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.11'
          - '3.13'
      failed_tests_only:
        description: 'Sadece @failed-tests etiketli testleri çalıştır'
        required: false
        default: false
        type: boolean

jobs:
  mocha:
    name: Mocha Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'mocha-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: mocha-tests/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: mocha-tests
        run: npm ci

      - name: Mocha testlerini çalıştır
        working-directory: mocha-tests
        run: |
          if [ "${{ inputs.failed_tests_only }}" = "true" ]; then
            npx mocha 'test/**/*.test.js' --reporter mocha-junit-reporter --reporter-options mochaFile=reports/junit.xml --grep "@failed-tests"
          else
            npm test
          fi

      - name: Mocha raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocha-junit-report
          path: mocha-tests/reports/junit.xml
          retention-days: 90

  vitest:
    name: Vitest Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'vitest-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: vitest-tests/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: vitest-tests
        run: npm ci

      - name: Vitest testlerini çalıştır
        working-directory: vitest-tests
        run: |
          if [ "${{ inputs.failed_tests_only }}" = "true" ]; then
            npx vitest run --reporter=junit --outputFile=reports/junit.xml -t "@failed-tests"
          else
            npm test
          fi

      - name: Vitest raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: vitest-tests/reports/junit.xml
          retention-days: 90

  jest:
    name: Jest Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'jest-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: jest-tests/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: jest-tests
        run: npm ci

      - name: Jest testlerini çalıştır
        working-directory: jest-tests
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml
          JEST_JUNIT_SUITE_NAME: '{filepath}'
          JEST_JUNIT_CLASSNAME: '{classname}'
          JEST_JUNIT_TITLE: '{title}'
        run: |
          if [ "${{ inputs.failed_tests_only }}" = "true" ]; then
            npm test -- --testNamePattern="@failed-tests"
          else
            npm test
          fi

      - name: Jest raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit-report
          path: jest-tests/reports/junit.xml
          retention-days: 90

  cypress:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'cypress-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: cypress-tests/package-lock.json

      - name: Cypress testlerini çalıştır
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-tests
          browser: electron
          command: npm test

      - name: Cypress raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-junit-report
          path: cypress-tests/reports/junit.xml
          retention-days: 90

  pytest:
    name: Pytest Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'pytest-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: pytest-tests/requirements.txt

      - name: Bağımlılıkları yükle
        working-directory: pytest-tests
        run: pip install -r requirements.txt

      - name: Pytest testlerini çalıştır
        working-directory: pytest-tests
        run: |
          if [ "${{ inputs.failed_tests_only }}" = "true" ]; then
            pytest tests/ --junitxml=reports/junit.xml -v --tb=short -k "failed_tests"
          else
            pytest tests/ --junitxml=reports/junit.xml -v --tb=short
          fi

      - name: Pytest raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: pytest-tests/reports/junit.xml
          retention-days: 90

  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'playwright-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: playwright-tests/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: playwright-tests
        run: npm ci

      - name: Playwright tarayıcılarını kur
        working-directory: playwright-tests
        run: npx playwright install chromium --with-deps

      - name: Playwright testlerini çalıştır
        working-directory: playwright-tests
        run: |
          if [ "${{ inputs.failed_tests_only }}" = "true" ]; then
            npx playwright test --grep "@failed-tests"
          else
            npm test
          fi

      - name: Playwright HTML raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          retention-days: 90

  hurl:
    name: Hurl API Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'hurl-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Hurl kur
        run: |
          LATEST=$(curl -sSfL https://api.github.com/repos/Orange-OpenSource/hurl/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          curl -sSfL \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${LATEST}/hurl_${LATEST}_amd64.deb" \
            -o hurl.deb
          sudo dpkg -i hurl.deb

      - name: Hurl testlerini çalıştır
        run: |
          hurl --test \
            --report-html hurl-report \
            hurl-tests/tests/posts.hurl \
            hurl-tests/tests/users.hurl \
            hurl-tests/tests/todos.hurl
        continue-on-error: true

      - name: Hurl raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurl-report
          path: hurl-report/
          retention-days: 90

  k6:
    name: k6 Performance Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.suite == 'both' || inputs.suite == 'k6-only' }}
    container:
      image: grafana/k6:latest
      options: --entrypoint /bin/sh --user root

    steps:
      - uses: actions/checkout@v4

      - name: k6 testlerini sırayla çalıştır
        run: |
          OVERALL=0
          for SCRIPT in k6-tests/scripts/*.js; do
            NAME=$(basename "$SCRIPT" .js)
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ $NAME"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            k6 run "$SCRIPT" || OVERALL=1
          done
          exit $OVERALL
        continue-on-error: true

      - name: k6 raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: '*-summary.json'
          if-no-files-found: warn
          retention-days: 90

  merge-reports:
    name: Raporları Birleştir
    runs-on: ubuntu-latest
    needs: [jest, vitest, mocha, pytest, cypress, playwright, hurl, k6]
    if: always()

    steps:
      - name: Jest raporunu indir
        uses: actions/download-artifact@v4
        with:
          name: jest-junit-report
          path: reports/jest
        continue-on-error: true

      - name: Vitest raporunu indir
        uses: actions/download-artifact@v4
        with:
          name: vitest-junit-report
          path: reports/vitest
        continue-on-error: true

      - name: Mocha raporunu indir
        uses: actions/download-artifact@v4
        with:
          name: mocha-junit-report
          path: reports/mocha
        continue-on-error: true

      - name: Pytest raporunu indir
        uses: actions/download-artifact@v4
        with:
          name: pytest-junit-report
          path: reports/pytest
        continue-on-error: true

      - name: Cypress raporunu indir
        uses: actions/download-artifact@v4
        with:
          name: cypress-junit-report
          path: reports/cypress
        continue-on-error: true

      - name: XML raporları birleştir
        run: |
          python3 - <<'PYEOF'
          import glob, re

          suites = []
          for xml_file in sorted(glob.glob('reports/*/junit.xml')):
              with open(xml_file) as f:
                  content = f.read()
              for s in re.findall(r'<testsuite\b[\s\S]*?</testsuite>', content):
                  # Boş Root Suite'leri atla
                  if re.search(r'\btests="0"', s) and '<testcase' not in s:
                      continue
                  suites.append(s)

          total    = sum(int(m.group(1)) for s in suites for m in [re.search(r'\btests="(\d+)"',    s)] if m)
          failures = sum(int(m.group(1)) for s in suites for m in [re.search(r'\bfailures="(\d+)"', s)] if m)

          with open('junit-combined.xml', 'w') as f:
              f.write(f'<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write(f'<testsuites tests="{total}" failures="{failures}">\n')
              for s in suites:
                  f.write(s + '\n')
              f.write('</testsuites>\n')

          print(f"Birleştirildi: {total} test, {failures} hata, {len(suites)} suite")
          PYEOF

      - name: Birleşik raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-combined-report
          path: junit-combined.xml
          retention-days: 90
