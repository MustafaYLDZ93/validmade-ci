name: Pytest Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'pytest-tests/**'
      - '.github/workflows/pytest-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pytest-tests/**'
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pytest-tests/requirements.txt

      - name: Bağımlılıkları yükle
        working-directory: pytest-tests
        run: pip install -r requirements.txt

      - name: Testleri çalıştır (JUnit XML çıktısı)
        working-directory: pytest-tests
        run: |
          pytest tests/ \
            --junitxml=reports/junit.xml \
            -v \
            --tb=short

      - name: Test raporu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: pytest-tests/reports/junit.xml
          retention-days: 90
