name: Pytest Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'pytest-tests/**'
      - '.github/workflows/pytest-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pytest-tests/**'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python versiyonu'
        required: false
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.11'
          - '3.13'
      test_filter:
        description: 'Test filtresi (ör: test_calculator veya boş bırak hepsini koş)'
        required: false
        default: ''
        type: string
      fail_fast:
        description: 'İlk hata görülünce dur (-x)'
        required: false
        default: false
        type: boolean

jobs:
  pytest:
    name: Pytest Tests (Python ${{ inputs.python_version || '3.12' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.12' }}
          cache: 'pip'
          cache-dependency-path: pytest-tests/requirements.txt

      - name: Bağımlılıkları yükle
        working-directory: pytest-tests
        run: pip install -r requirements.txt

      - name: Testleri çalıştır (JUnit XML çıktısı)
        working-directory: pytest-tests
        run: |
          pytest tests/ \
            --junitxml=reports/junit.xml \
            -v \
            --tb=short \
            ${{ inputs.fail_fast == 'true' && '-x' || '' }} \
            ${{ inputs.test_filter != '' && format('-k "{0}"', inputs.test_filter) || '' }}

      - name: Test raporu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: pytest-tests/reports/junit.xml
          retention-days: 90
