name: Jest Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'jest-tests/**'
      - '.github/workflows/jest-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'jest-tests/**'
  workflow_dispatch:

jobs:
  jest:
    name: Jest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jest-tests/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: jest-tests
        run: npm ci

      - name: Testleri çalıştır (JUnit XML çıktısı)
        working-directory: jest-tests
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml
          JEST_JUNIT_SUITE_NAME: '{filepath}'
          JEST_JUNIT_CLASSNAME: '{classname}'
          JEST_JUNIT_TITLE: '{title}'
        run: npm test

      - name: Test raporu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit-report
          path: jest-tests/reports/junit.xml
          retention-days: 90
