name: Playwright Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'playwright-tests/**'
      - '.github/workflows/playwright-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'playwright-tests/**'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js versiyonu'
        required: false
        default: '20'
        type: choice
        options:
          - '20'
          - '22'
          - '18'
      failed_tests_only:
        description: 'Sadece @failed-tests etiketli testleri çalıştır'
        required: false
        default: false
        type: boolean

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '20' }}
          cache: 'npm'
          cache-dependency-path: playwright-tests/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: playwright-tests
        run: npm ci

      - name: Playwright tarayıcılarını kur
        working-directory: playwright-tests
        run: npx playwright install chromium --with-deps

      - name: Playwright testlerini çalıştır
        working-directory: playwright-tests
        run: |
          if [ "${{ inputs.failed_tests_only }}" = "true" ]; then
            npx playwright test --grep "@failed-tests"
          else
            npm test
          fi

      - name: Playwright HTML raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          retention-days: 90

