name: k6 Performance Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'k6-tests/**'
      - '.github/workflows/k6-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'k6-tests/**'
  workflow_dispatch:

jobs:
  k6:
    name: k6 Performance Tests
    runs-on: ubuntu-latest
    container:
      image: grafana/k6:latest
      options: --entrypoint /bin/sh --user root

    steps:
      - uses: actions/checkout@v4

      - name: k6 testlerini sırayla çalıştır
        run: |
          OVERALL=0
          for SCRIPT in k6-tests/scripts/*.js; do
            NAME=$(basename "$SCRIPT" .js)
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ $NAME"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            k6 run "$SCRIPT" || OVERALL=1
          done
          exit $OVERALL
        continue-on-error: true

      - name: k6 raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: '*-summary.json'
          if-no-files-found: warn
          retention-days: 90
