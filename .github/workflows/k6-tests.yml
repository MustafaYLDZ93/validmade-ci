name: k6 Performance Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'k6-tests/**'
      - '.github/workflows/k6-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'k6-tests/**'
  workflow_dispatch:

jobs:
  k6:
    name: k6 Performance Tests
    runs-on: ubuntu-latest
    container:
      image: grafana/k6:latest
      options: --entrypoint /bin/sh --user root

    steps:
      - uses: actions/checkout@v4

      - name: k6 testlerini çalıştır
        run: k6 run k6-tests/scripts/api_test.js
        continue-on-error: true

      - name: k6 raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: k6-summary.json
          if-no-files-found: warn
          retention-days: 90
